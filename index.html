<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#fff8f1">
    <meta name="description" content="Một món quà sinh nhật nhỏ đang chờ được mở.">
    <title>Một món quà dành cho Em</title>
    <link rel="stylesheet" href="gift.css">
    <script src="js/gift.js" defer></script>
</head>
<body class="gift-page">
    <header class="gift-header">
        <a class="gift-wordmark" href="birthday.html" aria-label="Đến tấm thiệp">
            <span class="gift-wordmark-mark" aria-hidden="true">✳</span>
            <span>một tấm thiệp <strong>nhỏ</strong></span>
        </a>
        <span class="header-date">GỬI RIÊNG CHO EM <span aria-hidden="true">♡</span></span>
    </header>

    <main class="gift-main">
        <section class="gift-stage" aria-labelledby="gift-title">
            <p class="gift-eyebrow"><span aria-hidden="true">✿</span> CÓ MỘT ĐIỀU NHỎ MUỐN GỬI EM</p>
            <h1 id="gift-title">Một món quà<br>dành cho <em>Em.</em></h1>
            <p class="gift-invitation">Chạm nhẹ thôi, bất ngờ đang đợi ở bên trong.</p>

            <a class="gift-open" id="open-gift" href="birthday.html" aria-label="Mở món quà sinh nhật">
                <span class="gift-illustration" aria-hidden="true">
                    <span class="gift-spark gift-spark-one">✦</span>
                    <span class="gift-spark gift-spark-two">✳</span>
                    <span class="gift-spark gift-spark-three">♡</span>
                    <span class="gift-shadow"></span>
                    <span class="gift-box">
                        <span class="gift-bow">
                            <span class="bow-loop bow-loop-left"></span>
                            <span class="bow-loop bow-loop-right"></span>
                            <span class="bow-knot"></span>
                        </span>
                        <span class="gift-lid"><span class="gift-ribbon lid-ribbon"></span></span>
                        <span class="gift-base"><span class="gift-ribbon base-ribbon"></span></span>
                    </span>
                </span>
                <span class="gift-open-label">Mở món quà <span aria-hidden="true">↗</span></span>
            </a>

            <p class="gift-footnote">Một chút yêu thương, gói riêng cho ngày của Em.</p>
        </section>
    </main>

    <footer class="gift-footer">
        <span>Được gói bằng tất cả sự dịu dàng.</span>
        <span class="footer-spark" aria-hidden="true">✳</span>
    </footer>
</body>
</html>
